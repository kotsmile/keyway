[package]
name = "keyway"
description = "The keyway backend: a secrets console over the secret managers you already run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keyway-server"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
