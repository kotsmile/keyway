[package]
name = "keyway"
description = "The keyway backend: a secrets console over the secret managers you already run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keyway-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
zeroize = "1.9.0"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
