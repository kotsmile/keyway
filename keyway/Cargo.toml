[package]
name = "keyway"
description = "The keyway backend: a secrets console over the secret managers you already run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keyway-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
eyre = "0.6.14"
getrandom = "0.4.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde", "v5"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
zeroize = "1.9.0"
gcp_auth = "0.12.7"
urlencoding = "2.1.3"
aws-config = { version = "1.11.0", default-features = false, features = ["rustls", "behavior-version-latest"] }
aws-sdk-secretsmanager = { version = "1.114.0", default-features = false, features = ["rustls", "behavior-version-latest"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "runtime"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
