[package]
name = "keyway"
description = "The keyway backend: a secrets console over the secret managers you already run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keyway-server"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
