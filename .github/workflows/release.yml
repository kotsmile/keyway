# Cut a release by pushing a tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# That builds both images for amd64 and arm64, pushes them to GHCR tagged with
# the version (and `latest`), and opens a GitHub release with generated notes.
# The Helm chart in deploy/chart/keyway points at these images by default.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: keyway
            context: .
          - image: keyway-dashboard
            context: ./keyway-dashboard

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  release:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
