name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Queries are checked against the committed .sqlx cache, so a build needs no
  # database. `cargo sqlx prepare` regenerates it; a query changed without
  # regenerating fails here rather than at runtime.
  SQLX_OFFLINE: true

jobs:
  # The Go port (ADR-0006) grows at the repo root while the Rust server still
  # ships; both jobs run until the cutover deletes the crates.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal embed.go)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  rust:
    runs-on: ubuntu-latest

    # The schema tests skip themselves when KEYWAY_TEST_DATABASE_URL is unset,
    # which keeps `cargo test` runnable on a laptop with no database — so CI
    # has to provide one, or they would pass by doing nothing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keyway
          POSTGRES_PASSWORD: keyway
          POSTGRES_DB: keyway
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all
        env:
          KEYWAY_TEST_DATABASE_URL: postgres://keyway:keyway@localhost:5432/keyway
