name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest

    # The persistence and schema tests skip themselves when
    # KEYWAY_TEST_DATABASE_URL is unset, which keeps `go test ./...` runnable
    # on a laptop with no database — so CI has to provide one, or they would
    # pass by doing nothing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keyway
          POSTGRES_PASSWORD: keyway
          POSTGRES_DB: keyway
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd config internal embed.go)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          KEYWAY_TEST_DATABASE_URL: postgres://keyway:keyway@localhost:5432/keyway?sslmode=disable
