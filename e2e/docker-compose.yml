# The e2e wiring, from the parity gate (kotsmile/keyway#29): the Go server on
# a Rust-lineage schema, exercised by the unchanged clients. Run via
# e2e/run.sh, which seeds postgres the way the (since-deleted) Rust server
# left deployed databases BEFORE keywayd is allowed near it — see
# e2e/rust-migrations/README.md.
name: keyway-e2e
services:
  postgres:
    image: postgres:18
    container_name: keyway-e2e-postgres
    environment:
      POSTGRES_USER: keyway
      POSTGRES_PASSWORD: keyway
      POSTGRES_DB: keyway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyway -d keyway"]
      interval: 1s
      timeout: 3s
      retries: 60

  keywayd:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    container_name: keyway-e2e-keywayd
    command: ["serve", "-c", "/etc/keyway/config.yml"]
    environment:
      KEYWAY_E2E_AES_KEY: ${KEYWAY_E2E_AES_KEY:?set by run.sh — openssl rand -base64 32}
    volumes:
      - ./config.yml:/etc/keyway/config.yml:ro
    ports:
      - "18080:8080"
      - "19090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 3s
      retries: 60
