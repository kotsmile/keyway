[workspace]
resolver = "3"
members = ["crates/keyway", "crates/keyway-cli", "crates/keyway-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kotsmile/keyway"

[workspace.dependencies]
keyway-core = { path = "crates/keyway-core" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
