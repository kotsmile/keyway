[package]
name = "keyway-cli"
description = "The keyway command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately does not depend on `keyway`. The CLI speaks the HTTP API and
# defines its own wire types; depending on the backend would compile the whole
# server — database driver, cloud SDKs and all — into a binary that formats
# output.

[[bin]]
name = "keyway"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
eyre = "0.6.14"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
