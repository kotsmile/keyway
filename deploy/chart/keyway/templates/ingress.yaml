{{- if .Values.ingress.enabled }}
{{- /* The dashboard's nginx proxies /api and /auth to the backend, so one
     backend covers everything. Without the dashboard the API is the site. */}}
{{- $service := ternary (include "keyway.dashboard.fullname" .) (include "keyway.fullname" .) .Values.dashboard.enabled }}
{{- $port := ternary .Values.dashboard.service.port .Values.service.port .Values.dashboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "keyway.fullname" . }}
  labels:
    {{- include "keyway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $service }}
                port:
                  number: {{ $port }}
    {{- end }}
{{- end }}
