# The quickstart's configuration.
#
# DO NOT DEPLOY THIS. There is no issuer, so keyway authenticates nobody and
# acts as `dev` — every authorisation decision is still made, which is the
# point of a pass-through rather than a bypass, but anyone who can reach the
# port is `dev`.

server:
  address: ":8080"
  metrics_address: ":9090"

postgres:
  addr: postgres:5432
  name: keyway
  user: keyway
  password: ${env:PGPASSWORD}
  sslmode: disable

# No issuer: dev mode. Configure `issuer`, `client_id` and `client_secret` to
# turn authentication on.
oidc:
  dev_user: dev
  dev_roles: [admin, create]
  dev_groups: [everyone]

branding:
  name: keyway

stores:
  # keyway's own store: versions in Postgres, payloads sealed with AES-256-GCM
  # under a key that arrives through the environment.
  - id: local
    type: keyway
    title: Local store
    allow: [read, edit, create, delete]
    key_id: v1
    key: ${env:KEYWAY_KEY}
