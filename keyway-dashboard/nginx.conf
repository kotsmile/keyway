server {
  listen 8081;
  root /usr/share/nginx/html;

  # The console routes on the hash, so every path serves index.html and the
  # SPA sorts it out.
  location / {
    try_files $uri /index.html;
  }

  # Hashed assets never change under a name; index.html always must be
  # re-fetched, or a deploy leaves people on the old bundle talking to the new
  # API.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
